{% extends "base.html" %}

{% block title %}{{ title }} — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section narrow">
  <h1>{{ title }}</h1>
  <p class="section-lede">Secrets stay in the app database for beta. Rotate credentials after trials.</p>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
  </form>
</section>
{% endblock %}
