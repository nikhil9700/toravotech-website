{% extends "base.html" %}

{% block title %}Sign in — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section narrow">
  <h1>Sign in</h1>
  <form method="post" class="stack-form" action="{% url 'account_login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="muted">Public access is closed while we finish testing. <a href="{% url 'home' %}">Back home</a></p>
</section>
{% endblock %}
