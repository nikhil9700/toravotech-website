{% extends "base.html" %}

{% block title %}Sign out — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section narrow">
  <h1>Sign out</h1>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button class="btn" type="submit">Sign out</button>
  </form>
</section>
{% endblock %}
