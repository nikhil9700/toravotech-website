services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toravotech
      POSTGRES_USER: toravotech
      POSTGRES_PASSWORD: toravotech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toravotech -d toravotech"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build: .
    command: /app/scripts/entrypoint.sh web
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://toravotech:toravotech@db:5432/toravotech
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build: .
    command: /app/scripts/entrypoint.sh worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://toravotech:toravotech@db:5432/toravotech
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
